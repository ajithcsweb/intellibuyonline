<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>IntelliBuy.in | Smart Price Comparison & AI Deals Engine</title>
    <meta name="title" content="IntelliBuy.in | Smart Price Comparison & AI Deals Engine" />
    <meta name="description" content="Compare prices for 100,000+ products across Amazon, Flipkart, Croma, and Reliance Digital. Get real-time price history graphs, AI recommendations, and verified bank coupons in India." />
    <meta name="keywords" content="price comparison India, Amazon Flipkart price compare, price history graph, smart tech deals, IntelliBuy, intellibuy.in" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://intellibuy.in/" />

    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="9OpZw5XeiR7UNFdm8M1S9_n0083TcEjhDA32TbkbXtQ" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://intellibuy.in/" />
    <meta property="og:site_name" content="IntelliBuy.in" />
    <meta property="og:title" content="IntelliBuy.in | Smart Price Comparison & AI Deals Engine" />
    <meta property="og:description" content="Find the best tech deal. Compare prices, track 6-month price history, and buy smarter across top Indian online stores." />
    <meta property="og:image" content="https://intellibuy.in/favicon.svg" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://intellibuy.in/" />
    <meta property="twitter:title" content="IntelliBuy.in | Smart Price Comparison & AI Deals Engine" />
    <meta property="twitter:description" content="Find the best tech deal. Compare prices, track 6-month price history, and buy smarter." />
    <meta property="twitter:image" content="https://intellibuy.in/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            colors: {
              google: {
                blue: '#1A73E8',
                blueDark: '#1557B0',
                bg: '#F8F9FA',
                surface: '#FFFFFF',
                text: '#202124',
                secondary: '#5F6368',
                border: '#E8EAED',
                green: '#188038',
                yellow: '#F9AB00',
                red: '#D93025'
              }
            }
          }
        }
      }
    </script>

    <!-- Google Structured Data (JSON-LD) for Search Console Rich Snippets -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "IntelliBuy",
      "alternateName": "IntelliBuy.in",
      "url": "https://intellibuy.in/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://intellibuy.in/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="min-h-screen bg-[#F8F9FA] text-[#202124] font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
